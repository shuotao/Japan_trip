<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐廳與購物拆帳 | 北海道滑雪之旅</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        .card {
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #fbd38d;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ed8936;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icons
        const IconArrowLeft = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg>
        );
        const IconUsers = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>
        );
        const IconUtensils = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" /><path d="M7 2v20" /><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" /></svg>
        );
        const IconShoppingBag = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" /><path d="M3 6h18" /><path d="M16 10a4 4 0 0 1-8 0" /></svg>
        );
        const IconPlus = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 5v14" /><path d="M5 12h14" /></svg>
        );
        const IconTrash = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18" /><path d="M19 6v14c0 1.1-.9 2-2 2H7c-1.1 0-2-.9-2-2V6" /><path d="M8 6V4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v2" /></svg>
        );

        const ShareCostsApp = () => {
            const [selectedMember, setSelectedMember] = useState(null);
            const members = [
                { id: 'member1', name: '成員A', emoji: '🐋' },
                { id: 'member2', name: '成員B', emoji: '🎿' },
                { id: 'member3', name: '成員C', emoji: '🐍' },
                { id: 'member4', name: '成員D', emoji: '🧸' },
                { id: 'coach', name: '教練', emoji: '⛷️' }
            ];

            const initialExpenses = [
                {
                    id: 1,
                    desc: '晚餐 (範例)',
                    amount: 25000,
                    payer: 'member1',
                    participants: ['member1', 'member2', 'member3', 'member4', 'coach'],
                    type: 'restaurant',
                    date: '2/8'
                },
                {
                    id: 2,
                    desc: '午餐 (個別金額範例)',
                    amount: 12800,
                    payer: 'member4',
                    participants: ['member1', 'member2', 'member3', 'member4', 'coach'],
                    customShares: {
                        'member1': 4300,
                        'member2': 2500,
                        'member3': 2500,
                        'coach': 2500,
                        'member4': 1000
                    },
                    type: 'restaurant',
                    date: '2/8'
                },
                {
                    id: 3,
                    desc: '拉麵店 (成員A支付範例)',
                    amount: 15540,
                    payer: 'member1',
                    participants: ['member1', 'member2', 'member3', 'member4'],
                    customShares: {
                        'member3': 3550,
                        'member1': 5940,
                        'member2': 3080,
                        'member4': 2970
                    },
                    type: 'restaurant',
                    date: '2/9'
                }
            ];

            const [expenses, setExpenses] = useState(() => {
                const saved = localStorage.getItem('trip_share_costs_v1');
                return saved ? JSON.parse(saved) : initialExpenses;
            });

            const [newExpense, setNewExpense] = useState({
                desc: '',
                amount: '',
                payer: 'member1',
                participants: members.map(m => m.id),
                type: 'restaurant',
                isCustom: false,
                customShares: null
            });

            useEffect(() => {
                localStorage.setItem('trip_share_costs_v1', JSON.stringify(expenses));
            }, [expenses]);

            const addExpense = () => {
                if (!newExpense.desc || !newExpense.amount) return;
                setExpenses([...expenses, { ...newExpense, id: Date.now(), amount: parseFloat(newExpense.amount) }]);
                setNewExpense({
                    ...newExpense,
                    desc: '',
                    amount: '',
                    isCustom: false,
                    customShares: null,
                    participants: members.map(m => m.id)
                });
            };

            const removeExpense = (id) => {
                setExpenses(expenses.filter(e => e.id !== id));
            };

            const toggleParticipant = (memberId) => {
                const newParticipants = newExpense.participants.includes(memberId)
                    ? newExpense.participants.filter(id => id !== memberId)
                    : [...newExpense.participants, memberId];
                setNewExpense({ ...newExpense, participants: newParticipants });
            };

            // 計算每人明細與餘額
            const getMemberDetails = (memberId) => {
                let paidItems = [];
                let sharedItems = [];
                let balance = 0;

                expenses.forEach(exp => {
                    // 如果是付款者
                    if (exp.payer === memberId) {
                        paidItems.push({ desc: exp.desc, amount: exp.amount });
                        balance += exp.amount;
                    }

                    // 如果是參與者 (包含付款者自己)
                    let share = 0;
                    if (exp.customShares && exp.customShares[memberId]) {
                        share = exp.customShares[memberId];
                    } else if (exp.participants.includes(memberId)) {
                        share = exp.amount / exp.participants.length;
                    }

                    if (share > 0) {
                        sharedItems.push({ desc: exp.desc, amount: share });
                        balance -= share;
                    }
                });

                return { paidItems, sharedItems, balance };
            };

            const formatYen = (amount) => `¥${Math.round(amount).toLocaleString()}`;

            return (
                <div className="flex flex-col min-h-screen max-w-md mx-auto bg-white shadow-2xl overflow-hidden">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-orange-500 to-yellow-500 text-white p-5 sticky top-0 z-20 shadow-md">
                        <div className="flex items-center gap-3">
                            <a href="index.html" className="p-2 hover:bg-white/20 rounded-full transition-colors">
                                <IconArrowLeft className="w-5 h-5" />
                            </a>
                            <div>
                                <h1 className="text-xl font-bold flex items-center gap-2">
                                    <IconUsers className="w-6 h-6" />
                                    餐廳與購物公費拆帳
                                </h1>
                                <p className="text-orange-100 text-sm">2/5 - 2/12 旅程專用</p>
                            </div>
                        </div>
                    </div>

                    <div className="p-4 space-y-6 flex-1 overflow-y-auto bg-slate-50">
                        {/* 總結面板 */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 animate-fade-in">
                            <h2 className="font-bold text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-100 pb-2">
                                📊 分帳總覽 (點擊查看明細)
                            </h2>
                            <div className="grid grid-cols-1 gap-3">
                                {members.map(m => {
                                    const { balance, paidItems, sharedItems } = getMemberDetails(m.id);
                                    const isExpanded = selectedMember === m.id;

                                    return (
                                        <div key={m.id} className="space-y-2">
                                            <div
                                                onClick={() => setSelectedMember(isExpanded ? null : m.id)}
                                                className={`flex justify-between items-center p-3 rounded-xl border-2 transition-all cursor-pointer ${isExpanded ? 'border-orange-500 bg-orange-50' : 'border-slate-100 bg-slate-50 hover:border-slate-200'}`}
                                            >
                                                <div className="flex items-center gap-3">
                                                    <span className="text-2xl">{m.emoji}</span>
                                                    <span className="font-bold text-slate-700">{m.name}</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className={`font-mono font-bold text-lg ${balance >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                        {balance >= 0 ? '+' : ''}{formatYen(balance)}
                                                    </span>
                                                </div>
                                            </div>

                                            {isExpanded && (
                                                <div className="bg-white border border-orange-200 rounded-xl p-4 text-sm animate-fade-in mx-1 shadow-inner">
                                                    {paidItems.length > 0 && (
                                                        <div className="mb-3">
                                                            <h4 className="text-xs font-bold text-green-600 uppercase mb-2 border-b border-green-50">✨ 幫大家墊付的</h4>
                                                            {paidItems.map((item, idx) => (
                                                                <div key={idx} className="flex justify-between py-1 border-b border-slate-50 last:border-0">
                                                                    <span className="text-slate-600 truncate mr-2">{item.desc}</span>
                                                                    <span className="font-mono text-green-600 font-bold shrink-0">+{formatYen(item.amount)}</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}

                                                    {sharedItems.length > 0 && (
                                                        <div>
                                                            <h4 className="text-xs font-bold text-red-500 uppercase mb-2 border-b border-red-50">📉 自己該出的份</h4>
                                                            {sharedItems.map((item, idx) => (
                                                                <div key={idx} className="flex justify-between py-1 border-b border-slate-50 last:border-0 text-slate-500">
                                                                    <span className="truncate mr-2">{item.desc}</span>
                                                                    <span className="font-mono font-bold shrink-0">-{formatYen(item.amount)}</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}

                                                    <div className="mt-3 pt-2 border-t border-slate-100 flex justify-between items-center">
                                                        <span className="font-bold text-slate-800">最後清算</span>
                                                        <span className={`font-mono font-bold text-lg ${balance >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                            {balance >= 0 ? '應收' : '應付'} {formatYen(Math.abs(balance))}
                                                        </span>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                            <div className="mt-4 p-3 bg-blue-50 rounded-lg border border-blue-100 text-xs text-blue-700 leading-relaxed text-center">
                                💡 正值 (+) 代表該成員墊付較多，應收款項。<br />
                                負值 (-) 代表該成員應支付給墊付者的金額。
                            </div>
                        </div>

                        {/* 新增費用 */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-4">
                            <h2 className="font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-2">
                                <IconPlus className="w-5 h-5 text-orange-500" />
                                新增支出項目
                            </h2>

                            <div className="space-y-3">
                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase px-1">項目描述</label>
                                    <input
                                        type="text"
                                        placeholder="例如：米其林晚餐、藥妝店購物"
                                        className="w-full mt-1 p-3 bg-slate-50 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition-all"
                                        value={newExpense.desc}
                                        onChange={(e) => setNewExpense({ ...newExpense, desc: e.target.value })}
                                    />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase px-1">金額 (JPY)</label>
                                        <input
                                            type="number"
                                            placeholder="¥"
                                            className="w-full mt-1 p-3 bg-slate-50 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition-all font-mono"
                                            value={newExpense.amount}
                                            onChange={(e) => setNewExpense({ ...newExpense, amount: e.target.value })}
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase px-1">類型</label>
                                        <select
                                            className="w-full mt-1 p-3 bg-slate-50 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 outline-none transition-all"
                                            value={newExpense.type}
                                            onChange={(e) => setNewExpense({ ...newExpense, type: e.target.value })}
                                        >
                                            <option value="restaurant">🍴 餐廳</option>
                                            <option value="shopping">🛍️ 購物</option>
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase px-1">誰付錢的？</label>
                                    <div className="flex flex-wrap gap-2 mt-2">
                                        {members.map(m => (
                                            <button
                                                key={m.id}
                                                onClick={() => setNewExpense({ ...newExpense, payer: m.id })}
                                                className={`px-3 py-2 rounded-xl border-2 transition-all flex items-center gap-1 ${newExpense.payer === m.id ? 'border-orange-500 bg-orange-50 text-orange-700' : 'border-slate-100 bg-slate-50 text-slate-500'}`}
                                            >
                                                <span>{m.emoji}</span>
                                                <span className="text-sm font-bold">{m.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <div className="flex justify-between items-center mb-2">
                                        <label className="text-xs font-bold text-slate-500 uppercase px-1">誰一起分？</label>
                                        <button
                                            onClick={() => {
                                                const isCustom = !newExpense.isCustom;
                                                const customShares = {};
                                                if (isCustom) members.forEach(m => customShares[m.id] = '');
                                                setNewExpense({ ...newExpense, isCustom, customShares: isCustom ? customShares : null });
                                            }}
                                            className={`text-[10px] px-2 py-1 rounded-full font-bold transition-all ${newExpense.isCustom ? 'bg-orange-500 text-white' : 'bg-slate-200 text-slate-600'}`}
                                        >
                                            {newExpense.isCustom ? '✓ 已開啟個別金額輸入' : '開啟按人頭輸入金額'}
                                        </button>
                                    </div>

                                    {newExpense.isCustom ? (
                                        <div className="space-y-2 bg-orange-50/50 p-3 rounded-xl border border-orange-100 animate-fade-in">
                                            {members.map(m => (
                                                <div key={m.id} className="flex items-center gap-3">
                                                    <span className="text-xl shrink-0 w-8">{m.emoji}</span>
                                                    <span className="text-sm font-bold text-slate-700 w-16">{m.name}</span>
                                                    <input
                                                        type="number"
                                                        placeholder="¥ 0"
                                                        className="flex-1 p-2 bg-white rounded-lg border border-slate-200 text-right font-mono text-sm focus:ring-2 focus:ring-orange-200 outline-none"
                                                        value={newExpense.customShares?.[m.id] || ''}
                                                        onChange={(e) => {
                                                            const val = e.target.value;
                                                            const newShares = { ...newExpense.customShares, [m.id]: val };
                                                            // 自動加總金額
                                                            let total = 0;
                                                            Object.values(newShares).forEach(v => {
                                                                if (v && !isNaN(parseFloat(v))) total += parseFloat(v);
                                                            });

                                                            setNewExpense({
                                                                ...newExpense,
                                                                customShares: newShares,
                                                                amount: total > 0 ? total : '',
                                                                participants: Object.keys(newShares).filter(k => newShares[k] !== '' && !isNaN(parseFloat(newShares[k])))
                                                            });
                                                        }}
                                                    />
                                                </div>
                                            ))}
                                            <p className="text-[10px] text-orange-400 text-center mt-2">※ 填寫金額後會自動更新上方「總金額」。</p>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="flex flex-wrap gap-2 mt-2">
                                                {members.map(m => (
                                                    <button
                                                        key={m.id}
                                                        onClick={() => toggleParticipant(m.id)}
                                                        className={`px-3 py-2 rounded-xl border-2 transition-all flex items-center gap-1 ${newExpense.participants.includes(m.id) ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-slate-100 bg-slate-50 text-slate-400'}`}
                                                    >
                                                        <span>{m.emoji}</span>
                                                        <span className="text-sm font-bold">{m.name}</span>
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="flex gap-2 mt-2 px-1">
                                                <button
                                                    onClick={() => setNewExpense({ ...newExpense, participants: members.map(m => m.id) })}
                                                    className="text-[10px] text-blue-600 underline"
                                                >全選</button>
                                                <button
                                                    onClick={() => setNewExpense({ ...newExpense, participants: [] })}
                                                    className="text-[10px] text-slate-500 underline"
                                                >清空</button>
                                            </div>
                                        </>
                                    )}
                                </div>

                                <button
                                    onClick={addExpense}
                                    className="w-full py-4 bg-gradient-to-r from-orange-500 to-yellow-500 text-white font-bold rounded-xl shadow-lg hover:shadow-xl active:scale-95 transition-all text-lg mt-4"
                                >
                                    紀錄這筆支出
                                </button>
                            </div>
                        </div>

                        {/* 支出列表 */}
                        <div className="space-y-3 pb-20">
                            <h2 className="font-bold text-slate-800 flex items-center gap-2 px-1">
                                📒 最近支出
                            </h2>
                            {expenses.length === 0 ? (
                                <div className="text-center py-10 bg-white rounded-2xl border border-dashed border-slate-300">
                                    <p className="text-slate-400 text-sm">尚無支出紀錄，開始記帳吧！</p>
                                </div>
                            ) : (
                                [...expenses].reverse().map(exp => (
                                    <div key={exp.id} className="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 relative group">
                                        <div className="flex justify-between items-start mb-2">
                                            <div className="flex items-center gap-2">
                                                {exp.type === 'restaurant' ? <IconUtensils className="text-orange-500 w-4 h-4" /> : <IconShoppingBag className="text-blue-500 w-4 h-4" />}
                                                <h3 className="font-bold text-slate-800">{exp.desc}</h3>
                                            </div>
                                            <span className="font-mono font-bold text-slate-900">{formatYen(exp.amount)}</span>
                                        </div>
                                        <div className="flex flex-wrap gap-1 items-center text-xs">
                                            <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">
                                                付款者：{members.find(m => m.id === exp.payer)?.name}
                                            </span>
                                            <span className="text-slate-300">|</span>
                                            <span className="text-slate-500">
                                                分享者：{exp.participants.map(pId => members.find(m => m.id === pId)?.emoji).join('')}
                                            </span>
                                        </div>
                                        <button
                                            onClick={() => removeExpense(exp.id)}
                                            className="absolute top-2 right-2 p-1 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
                                        >
                                            <IconTrash className="w-4 h-4" />
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    {/* Footer Actions */}
                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-white/80 backdrop-blur-md border-t border-slate-100 flex gap-2">
                        <button
                            onClick={() => {
                                if (confirm('確定要清空所有費用紀錄嗎？')) {
                                    setExpenses([]);
                                }
                            }}
                            className="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl text-sm"
                        >
                            清空所有費用
                        </button>
                        <a
                            href="index.html"
                            className="flex-[2] py-3 bg-slate-900 text-white font-bold rounded-xl text-sm text-center shadow-lg"
                        >
                            返回行程
                        </a>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShareCostsApp />);
    </script>
</body>

</html>
