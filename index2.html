                                                    <div className="flex justify-between text-rose-600 font-bold"><span>猿遊號 (大內宿接駁)</span><span>¥1,100 (現金)</span></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )
                            })}
                            className="flex items-center justify-center gap-3 w-full py-4 bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold rounded-2xl shadow-md hover:shadow-lg active:scale-[0.98] transition-all"
                        >
                            <IconTrain className="w-5 h-5" />
                            <span>交通請看我 (資訊與準備清單)</span>
                        </button>

                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1">
                                <IconWallet className="w-3.5 h-3.5" /> 家族旅行預估費用 (每位家人)
                            </h3>
                            <div className="flex justify-between items-end">
                                <div>
                                    <p className="text-2xl font-bold text-slate-800">¥118,113</p>
                                    <p className="text-xs text-slate-400">約 NT$ 26,000 (除機票/餐飲)</p>
                                </div>
                                <div className="text-right">
                                    <span className="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-bold">含 JR PASS / 住宿</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Ticket Request Sheet Reminder */}
                    <div className="bg-green-50 border-b border-green-100 p-4">
                        <div className="flex items-center gap-2 mb-2">
                            <IconTicket className="text-green-600 w-5 h-5" />
                            <h3 className="text-green-800 text-sm font-bold">新幹線指定席購票單</h3>
                        </div>
                        <p className="text-xs text-green-700 leading-relaxed mb-3">
                            抵達東京後，請將此單與 3 本護照交給 JR 綠色窗口，一次補齊 5 天的所有指定席票券。
                        </p>
                        <button
                            onClick={() => setSelectedBooking({
                                title: 'JR 指定席購票專用單 (Reservation Sheet)',
                                details: `JR東日本パス（東北エリア） 利用\n利用期間：2026/02/15 ～ 2026/02/19\n人数：大人 3名\n\n下記の指定席の手配をお願いします。\n(可能であれば、荷物置き場に近い席をお願いします)\n\n1. 【2/15 (日)】\n　はやぶさ 17号：東京 (10:00發) ➔ 仙台\n\n2. 【2/16 (月)】\n　やまびこ 134号：仙台 (10:44發) ➔ 福島\n\n3. 【2/16 (月)】\n　つばさ 133号：福島 (12:12發) ➔ 大石田\n\n4. 【2/17 (火)】\n　つばさ 140号：大石田 (11:30發) ➔ 福島\n\n5. 【2/19 (木)】\n　やまびこ 124号：福島 (08:15發) ➔ 東京`
                            })}
                            className="w-full py-2 bg-green-600 text-white text-xs font-bold rounded-lg hover:bg-green-700 transition-colors"
                        >
                            點擊開啟購票單內容
                        </button>
                    </div>

                    {/* Timeline */}
                    <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
                        {
                            itineraryData.map((day) => (
                                <div key={day.id} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden card">
                                    <div className="px-4 py-3 bg-slate-100 border-b border-slate-200 flex justify-between items-center">
                                        <div className="flex items-center gap-2">
                                            <div className="bg-orange-500 text-white text-xs font-bold px-2 py-1 rounded">
                                                {day.date.split(' ')[0]}
                                            </div>
                                            <h2 className="font-bold text-slate-800">{day.date.split(' ')[1]}</h2>
                                        </div>
                                        <span className="text-xs font-medium text-slate-500 truncate max-w-[150px]">{day.title}</span>
                                    </div>

                                    <div className="divide-y divide-slate-100">
                                        {
                                            day.events.map((event, idx) => (
                                                <div key={idx} className="p-4 hover:bg-slate-50 transition-colors">
                                                    <div className="flex gap-3">
                                                        <div className="mt-1 shrink-0">{getTypeIcon(event.type)}</div>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="flex justify-between items-start flex-wrap gap-1">
                                                                <h3 className="font-bold text-slate-900 leading-tight">
                                                                    {event.title}
                                                                    {event.tag && <span className="ml-2 bg-orange-100 text-orange-700 text-[10px] px-1.5 py-0.5 rounded-full align-middle">{event.tag}</span>}
                                                                </h3>
                                                                {event.time && (
                                                                    <span className="text-[10px] font-mono bg-slate-200 px-1.5 py-0.5 rounded text-slate-600 whitespace-nowrap">
                                                                        {event.time}
                                                                    </span>
                                                                )}
                                                            </div>

                                                            <p className="text-sm text-slate-600 mt-1 leading-relaxed">{parseMarkdown(event.desc)}</p>

                                                            <div className="flex flex-wrap gap-2 mt-3">
                                                                {(event.bookingId || event.details) && (
                                                                    <button
                                                                        onClick={() => setSelectedBooking(event)}
                                                                        className="inline-flex items-center gap-1 px-3 py-1.5 bg-blue-50 text-blue-600 text-xs font-bold rounded-lg border border-blue-100 hover:bg-blue-100 transition-all font-mono"
                                                                    >
                                                                        <IconInfo className="w-3.5 h-3.5" />
                                                                        {event.bookingId && !event.bookingId.includes('_') ? 'ORDER' : 'INFO'}
                                                                    </button>
                                                                )}
                                                                {event.link && (
                                                                    <a
                                                                        href={event.link}
                                                                        target="_blank"
                                                                        rel="noopener noreferrer"
                                                                        className={`inline-flex items-center gap-1 px-3 py-1.5 ${event.link.includes('instagram.com') ? 'bg-fuchsia-50 text-fuchsia-600 border-fuchsia-100 hover:bg-fuchsia-100' : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'} text-xs font-bold rounded-lg border transition-all`}
                                                                    >
                                                                        {event.link.includes('instagram.com') ? <IconInstagram className="w-3.5 h-3.5" /> : <IconExternalLink className="w-3.5 h-3.5" />}
                                                                        {event.link.includes('instagram.com') ? 'IG' : 'LINK'}
                                                                    </a>
                                                                )}
                                                                {event.address && (
                                                                    <a
                                                                        href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.address)}`}
                                                                        target="_blank"
                                                                        rel="noopener noreferrer"
                                                                        className="inline-flex items-center gap-1 px-3 py-1.5 bg-green-50 text-green-600 text-xs font-bold rounded-lg border border-green-100 hover:bg-green-100 transition-all"
                                                                    >
                                                                        <IconMapPin className="w-3.5 h-3.5" />
                                                                        MAP
                                                                    </a>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))
                                        }
                                    </div>
                                </div>
                            ))
                        }
                    </div>

                    {/* Booking Modal */}
                    {selectedBooking && (
                        <div
                            className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm animate-[fadeIn_0.2s_ease-out]"
                            onClick={() => setSelectedBooking(null)}
                        >
                            <div
                                className="bg-white w-full max-w-md max-h-[90vh] sm:rounded-2xl rounded-t-2xl shadow-2xl flex flex-col animate-[slideUp_0.3s_ease-out]"
                                onClick={e => e.stopPropagation()}
                            >
                                <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                                    <h3 className="font-bold text-slate-800 flex items-center gap-2">
                                        <IconInfo className="text-orange-600 w-5 h-5" />
                                        詳細資訊
                                    </h3>
                                    <button onClick={() => setSelectedBooking(null)} className="p-2 hover:bg-slate-200 rounded-full text-slate-500">
                                        <IconX className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="p-6 overflow-y-auto">
                                    <div className="space-y-5">
                                        {selectedBooking.type === 'transport_summary' ? (
                                            selectedBooking.content
                                        ) : (
                                            <>
                                                <div>
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">項目</label>
                                                    <p className="text-lg font-bold text-slate-900 leading-tight">{selectedBooking.title}</p>
                                                </div>

                                                {selectedBooking.bookingId && !selectedBooking.bookingId.includes('_') && (
                                                    <div className="bg-orange-50 p-4 rounded-xl border border-orange-100">
                                                        <label className="text-[10px] font-bold text-orange-400 uppercase tracking-wider block mb-1">預約編號</label>
                                                        <p className="text-2xl font-mono font-bold text-orange-700">{selectedBooking.bookingId}</p>
                                                    </div>
                                                )}

                                                {selectedBooking.details && (
                                                    <div>
                                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">詳細內容 / 交通攻略</label>
                                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm font-mono text-slate-700 whitespace-pre-line leading-relaxed">
                                                            {parseMarkdown(selectedBooking.details)}
                                                        </div>
                                                    </div>
                                                )}

                                                {selectedBooking.address && (
                                                    <div>
                                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">地址與地圖</label>
                                                        <div className="p-3 bg-slate-50 rounded-lg text-sm font-medium leading-snug">
                                                            {selectedBooking.address}
                                                        </div>
                                                    </div>
                                                )}
                                            </>
                                        )}
                                    </div>
                                </div>

                                <div className="p-4 border-t border-slate-100 bg-slate-50 rounded-b-2xl">
                                    <button onClick={() => setSelectedBooking(null)} className="w-full py-3 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition-all">
                                        關閉
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer Space */}
                    <div className="p-8 text-center text-slate-400 text-xs">
                        祝家族旅遊愉快平安 🏮
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TohokuTripApp />);
    </script>
</body>

</html>
